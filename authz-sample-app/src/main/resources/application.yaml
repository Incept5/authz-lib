quarkus:
  log:
    # Note: Allow trace logging to be switched on at runtime but don't enable it by default
    level: DEBUG
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,S} %X{correlationId} %-5p - [%c{3.}] (%t) %s%e%n"

    category:
      "org.incept5":
        level: TRACE

incept5:
  authz:

    filter:
      # Not regexes: `*` matches any run of characters, `{segment}` exactly one path segment.
      ignore-paths:
        - /public/*

    # Holders of backoffice.admin (or any role that extends it) need a multi-factor session,
    # except on the paths listed under skip-paths (the second-factor enrolment surface).
    mfa:
      required-roles:
        - backoffice.admin
      skip-paths:
        - /example/me

    roles:
      - name: backoffice.admin
        permissions:
          - example:read

      - name: backoffice.owner
        extends-role: backoffice.admin
        permissions:
          - example:create

      - name: org.user
        permissions:
          - example:read